<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5B942" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E27D" />
      <stop offset="100%" stop-color="#D9B432" />
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A56E44" />
      <stop offset="100%" stop-color="#7A4B27" />
    </linearGradient>
    <linearGradient id="chickenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B85D1B" />
      <stop offset="100%" stop-color="#7D320A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Registered Mark (R) -->
  <g transform="translate(370, 70)" stroke="#1a1a1a" stroke-width="2.5" fill="none">
    <circle cx="16" cy="16" r="14" />
    <text x="16" y="22" font-family="'Manrope', sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a" stroke="none" text-anchor="middle">R</text>
  </g>

  <!-- Laurel Wreath (Left & Right) -->
  <g filter="url(#shadow)">
    <!-- Left Wreath Leaves -->
    <g fill="url(#goldGrad)">
      <!-- Base branch curve -->
      <path d="M 230 260 C 140 250 110 160 190 75" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Leaves paired along arc -->
      <path d="M 190 75 Q 165 70 172 55 Q 185 62 190 75 Z" />
      <path d="M 195 82 Q 220 70 216 55 Q 200 65 195 82 Z" />
      
      <path d="M 168 100 Q 140 98 143 83 Q 158 88 168 100 Z" />
      <path d="M 172 108 Q 196 95 192 80 Q 178 92 172 108 Z" />

      <path d="M 150 130 Q 120 130 123 115 Q 138 120 150 130 Z" />
      <path d="M 154 138 Q 180 128 175 113 Q 160 124 154 138 Z" />

      <path d="M 139 165 Q 110 168 111 152 Q 128 155 139 165 Z" />
      <path d="M 143 174 Q 170 165 163 150 Q 150 160 143 174 Z" />

      <path d="M 136 202 Q 106 208 108 193 Q 124 195 136 202 Z" />
      <path d="M 141 210 Q 168 205 160 190 Q 148 200 141 210 Z" />

      <path d="M 143 238 Q 115 248 117 232 Q 132 233 143 238 Z" />
      <path d="M 150 244 Q 174 242 168 227 Q 155 235 150 244 Z" />

      <path d="M 160 268 Q 135 280 135 265 Q 148 262 160 268 Z" />
      <path d="M 170 272 Q 192 272 186 258 Q 175 265 170 272 Z" />
    </g>

    <!-- Right Wreath Leaves (Mirrored) -->
    <g fill="url(#goldGrad)">
      <path d="M 270 260 C 360 250 390 160 310 75" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 310 75 Q 335 70 328 55 Q 315 62 310 75 Z" />
      <path d="M 305 82 Q 280 70 284 55 Q 300 65 305 82 Z" />

      <path d="M 332 100 Q 360 98 357 83 Q 342 88 332 100 Z" />
      <path d="M 328 108 Q 304 95 308 80 Q 322 92 328 108 Z" />

      <path d="M 350 130 Q 380 130 377 115 Q 362 120 350 130 Z" />
      <path d="M 346 138 Q 320 128 325 113 Q 340 124 346 138 Z" />

      <path d="M 361 165 Q 390 168 389 152 Q 372 155 361 165 Z" />
      <path d="M 357 174 Q 330 165 337 150 Q 350 160 357 174 Z" />

      <path d="M 364 202 Q 394 208 392 193 Q 376 195 364 202 Z" />
      <path d="M 359 210 Q 332 205 340 190 Q 352 200 359 210 Z" />

      <path d="M 357 238 Q 385 248 383 232 Q 368 233 357 238 Z" />
      <path d="M 350 244 Q 326 242 332 227 Q 345 235 350 244 Z" />

      <path d="M 340 268 Q 365 280 365 265 Q 352 262 340 268 Z" />
      <path d="M 330 272 Q 308 272 314 258 Q 325 265 330 272 Z" />
    </g>
  </g>

  <!-- Central "GP" In Monogram Script Font -->
  <text x="250" y="200" text-anchor="middle" font-family="'Kalam', 'Bradley Hand', 'Merienda', cursive" font-size="96" font-weight="bold" fill="url(#goldGrad)" letter-spacing="4" filter="url(#shadow)">GP</text>

  <!-- Golden Satin Banner Ribbon -->
  <g filter="url(#shadow)">
    <!-- Ribbon tails left & right -->
    <path d="M 155 275 L 115 315 L 150 310 L 120 345 L 175 320 Z" fill="#996515" />
    <path d="M 345 275 L 385 315 L 350 310 L 380 345 L 325 320 Z" fill="#996515" />
    
    <!-- Ribbon main center banner -->
    <path d="M 160 260 C 210 250 290 250 340 260 L 330 310 C 285 300 215 300 170 310 Z" fill="url(#ribbonGrad)" />
    
    <!-- White Script "SGS" Text inside ribbon -->
    <text x="250" y="295" text-anchor="middle" font-family="'Kalam', 'Bradley Hand', 'Merienda', cursive" font-size="44" font-weight="bold" fill="#FFFFFF" letter-spacing="3" font-style="italic">SGS</text>
  </g>

  <!-- Traditional Wooden/Leaf Donne Palav Bowl & Food Item -->
  <g transform="translate(0, 15)" filter="url(#shadow)">
    <!-- Areca Leaf / Wood-grained Donne Bowl Base -->
    <path d="M 180 325 L 195 385 C 220 395 280 395 305 385 L 320 325 Z" fill="url(#bowlGrad)" stroke="#5A3315" stroke-width="2"/>
    <!-- Bowl rim highlight -->
    <ellipse cx="250" cy="327" rx="72" ry="12" fill="#8B5328" />

    <!-- Steaming Mounded Seeraga Samba Spiced Rice -->
    <path d="M 185 325 C 190 300 240 290 255 290 C 275 290 310 300 315 325 Z" fill="url(#riceGrad)" />
    <!-- Rice texture dots & spices -->
    <circle cx="215" cy="315" r="2.5" fill="#8C6D1F" />
    <circle cx="235" cy="305" r="3" fill="#6B5014" />
    <circle cx="270" cy="310" r="2" fill="#7A5817" />
    <circle cx="285" cy="320" r="2.5" fill="#6B5014" />
    <circle cx="250" cy="318" r="3.5" fill="#8C6D1F" />
    <!-- Fresh Mint & Coriander leaves in rice -->
    <path d="M 230 302 Q 220 295 225 288 Q 235 295 230 302 Z" fill="#2E7D32" />
    <path d="M 275 300 Q 285 294 288 286 Q 280 293 275 300 Z" fill="#388E3C" />
    
    <!-- Savory Roasted Chicken Drumstick resting on top -->
    <!-- Bone -->
    <path d="M 185 300 L 210 312" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    <circle cx="184" cy="300" r="5" fill="#EEEEEE" />
    <circle cx="188" cy="296" r="4.5" fill="#EEEEEE" />
    <!-- Roasted Drumstick Meat -->
    <ellipse cx="240" cy="310" rx="30" ry="16" transform="rotate(18, 240, 310)" fill="url(#chickenGrad)" />
    <!-- Glaze highlight -->
    <ellipse cx="245" cy="308" rx="18" ry="7" transform="rotate(18, 245, 308)" fill="#D35400" opacity="0.6" />
  </g>

  <!-- "Since 1989" Heritage Typography At Bottom -->
  <text x="250" y="445" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="30" font-weight="900" font-style="italic" fill="#111827" letter-spacing="1.5">Since1989</text>
</svg>